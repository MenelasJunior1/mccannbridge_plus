services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mccann_bridge_dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mccann_bridge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mccann_bridge_pgdata:/var/lib/postgresql/data

volumes:
  mccann_bridge_pgdata:
